<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>安全访问</title><style>body{font:16px system-ui;background:#10141c;color:#eef2f8;display:grid;place-items:center;min-height:95vh;margin:0}main{width:min(340px,85vw)}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:8px;border:1px solid #657188}button{cursor:pointer}#status{min-height:2em}</style></head><body><main><h1>安全访问</h1><p>请输入访问密码以查看内容。</p><form id="login"><label for="password">访问密码</label><input id="password" type="password" autocomplete="off" required><button type="submit">解锁</button><p id="status" role="status" aria-live="polite"></p></form></main><script>
'use strict';
const form=document.querySelector('#login');
form.addEventListener('submit',async event=>{
 event.preventDefault();
 const input=document.querySelector('#password'),button=form.querySelector('button'),status=document.querySelector('#status');
 let password=input.value; input.value=''; button.disabled=true; status.textContent='正在解锁…';
 try {
  const response=await fetch('payload.json',{cache:'no-store'}); if(!response.ok)throw new Error('fetch');
  const payload=await response.json();
  const bytes=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']); password='';
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.ciphertext));
  const content=JSON.parse(new TextDecoder().decode(clear));
  const markdownURL=URL.createObjectURL(new Blob([content.markdown],{type:'text/markdown;charset=utf-8'}));
  // Rewrite source links, including links rendered later from inert source HTML.
  const html=content.html.replace(/(href\s*=\s*["'])([^"']*\broadmap\.md(?:[?#][^"']*)?)(["'])/gi,(_match,start,_url,end)=>start+markdownURL+end+' download="roadmap.md"');
  document.open(); document.write(html); document.close();
 } catch(_error) { password=''; status.textContent='密码错误或内容无法解锁，请重试。'; button.disabled=false; input.focus(); }
});
</script></body></html>
